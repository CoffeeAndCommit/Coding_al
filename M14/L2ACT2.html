<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Class</title><style>
:root{--ink:#172033;--muted:#64748b;--brand:#5b5bd6;--bg:#f4f6fb;--line:#dce3ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:28px 18px 50px}.hero{background:linear-gradient(130deg,#16324f,#5b5bd6);color:white;padding:28px;border-radius:20px;margin-bottom:22px}
.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:700;opacity:.8}.hero h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:.35em 0}.hero p{margin-bottom:0;color:#e5e7ff}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #26355b0a}
h2{font-size:1.35rem;margin-top:0}h3{font-size:1.05rem}p{margin:.55em 0}code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}code{background:#eef0ff;padding:.12em .35em;border-radius:5px}pre{background:#111827;color:#e5e7eb;padding:16px;border-radius:12px;overflow:auto;white-space:pre-wrap}
button,.btn{border:0;border-radius:9px;background:var(--brand);color:white;padding:10px 15px;font-weight:650;cursor:pointer;margin:4px 4px 4px 0}button:hover{filter:brightness(.93)}input,select,textarea{font:inherit;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;max-width:100%}
input[type=number]{width:130px}.output{background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:9px;min-height:44px;margin-top:12px;overflow-wrap:anywhere;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{background:#eef0ff;padding:15px;border-radius:12px}.muted{color:var(--muted)}.tag{display:inline-block;background:#e0e7ff;color:#3730a3;padding:3px 9px;border-radius:999px;font-size:.8rem;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:30px}
</style></head>
<body><main class="wrap"><header class="hero"><div class="kicker">M14 · JavaScript Practice</div><h1>JS Class</h1><p>Create objects from a class using a constructor.</p></header>

<section class="card"><h2>Student class</h2><label>Name <input id="name" value="Ishaan"></label><label>Grade <select id="grade"><option>6</option><option selected>7</option><option>8</option></select></label><button onclick="createStudent()">Create student</button><div id="out" class="output" aria-live="polite"></div>
<pre>class Student {
  constructor(name, grade) {
    this.name = name;
    this.grade = grade;
  }
}</pre></section>
<footer>Practice page · Open this HTML file in your browser</footer></main>
<script>"use strict";

class Student{constructor(name,grade){this.name=name;this.grade=grade;}describe(){return `${this.name} is in grade ${this.grade}.`;}}
function createStudent(){const s=new Student(document.getElementById('name').value.trim()||'Student',document.getElementById('grade').value);document.getElementById('out').textContent=s.describe();}

</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Pagination</h1>
      <p class="lead mb-0">Use pagination to navigate between multiple pages.</p>
    </header>
    
<section class="bg-white rounded-4 shadow-sm p-4">
  <h2 class="h4">Student project gallery</h2><p>Page <strong id="pageNumber">1</strong> of 5</p>
  <nav aria-label="Project pages"><ul class="pagination flex-wrap">
    <li class="page-item disabled" id="prevItem"><button class="page-link" onclick="movePage(-1)">Previous</button></li>
    <li class="page-item active"><button class="page-link" onclick="setPage(1)">1</button></li>
    <li class="page-item"><button class="page-link" onclick="setPage(2)">2</button></li>
    <li class="page-item"><button class="page-link" onclick="setPage(3)">3</button></li>
    <li class="page-item"><button class="page-link" onclick="setPage(4)">4</button></li>
    <li class="page-item"><button class="page-link" onclick="setPage(5)">5</button></li>
    <li class="page-item" id="nextItem"><button class="page-link" onclick="movePage(1)">Next</button></li>
  </ul></nav><p id="pageText" class="alert alert-primary">Showing projects for page 1.</p>
</section>
<script>
let currentPage=1;
function setPage(n){currentPage=n;updatePage();}
function movePage(d){setPage(Math.max(1,Math.min(5,currentPage+d)));}
function updatePage(){
 document.getElementById('pageNumber').textContent=currentPage;
 document.getElementById('pageText').textContent='Showing projects for page '+currentPage+'.';
 document.querySelectorAll('.pagination .page-item').forEach(li=>li.classList.remove('active'));
 const buttons=[...document.querySelectorAll('.pagination button')];
 buttons.forEach(b=>{if(b.textContent.trim()===String(currentPage)) b.parentElement.classList.add('active');});
 document.getElementById('prevItem').classList.toggle('disabled',currentPage===1);
 document.getElementById('nextItem').classList.toggle('disabled',currentPage===5);
}
</script>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

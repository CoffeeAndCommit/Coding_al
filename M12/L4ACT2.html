<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badges</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Badges</h1>
      <p class="lead mb-0">Use badges to show counts, labels and status.</p>
    </header>
    
<section class="bg-white rounded-4 shadow-sm p-4">
  <h2 class="h4">Notifications <span class="badge text-bg-danger">4</span></h2>
  <p>Messages <span class="badge text-bg-primary">New</span></p>
  <p>Task status: <span class="badge text-bg-success">Completed</span></p>
  <p>Priority: <span class="badge text-bg-warning">Medium</span></p>
  <button class="btn btn-dark">Inbox <span class="badge text-bg-light">7</span></button>
  <hr><span class="badge rounded-pill text-bg-info">Rounded pill</span> <span class="badge rounded-pill text-bg-secondary">Another label</span>
</section>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

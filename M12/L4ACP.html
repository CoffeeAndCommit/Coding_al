<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a Slider</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Create a Slider</h1>
      <p class="lead mb-0">A simple interactive image-style slider made with Bootstrap Carousel.</p>
    </header>
    
<div id="hobbyCarousel" class="carousel slide shadow rounded-4 overflow-hidden" data-bs-ride="carousel">
  <div class="carousel-indicators"><button type="button" data-bs-target="#hobbyCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button><button type="button" data-bs-target="#hobbyCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button><button type="button" data-bs-target="#hobbyCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button></div>
  <div class="carousel-inner">
    <div class="carousel-item active"><div class="d-flex flex-column justify-content-center align-items-center text-center bg-primary text-white p-5" style="min-height:300px"><div class="display-1">🎨</div><h2>Creative Art</h2><p>Explore colors and imagination.</p></div></div>
    <div class="carousel-item"><div class="d-flex flex-column justify-content-center align-items-center text-center bg-success text-white p-5" style="min-height:300px"><div class="display-1">⚽</div><h2>Play Sports</h2><p>Practice, play and work as a team.</p></div></div>
    <div class="carousel-item"><div class="d-flex flex-column justify-content-center align-items-center text-center bg-dark text-white p-5" style="min-height:300px"><div class="display-1">💻</div><h2>Learn Coding</h2><p>Turn ideas into projects.</p></div></div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#hobbyCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Previous</span></button>
  <button class="carousel-control-next" type="button" data-bs-target="#hobbyCarousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Next</span></button>
</div>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

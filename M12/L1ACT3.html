<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grids for Desktop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Grids for Desktop</h1>
      <p class="lead mb-0">A desktop-friendly layout that stacks neatly on smaller screens.</p>
    </header>
    
<div class="row g-3">
  <div class="col-12"><div class="demo-box bg-dark text-white">Header</div></div>
  <div class="col-lg-3"><div class="demo-box bg-primary text-white">Navigation</div></div>
  <div class="col-lg-6"><div class="demo-box bg-white border text-dark p-3">Main content area</div></div>
  <div class="col-lg-3"><div class="demo-box bg-info text-dark">Sidebar</div></div>
  <div class="col-12"><div class="demo-box bg-secondary text-white">Footer</div></div>
</div>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

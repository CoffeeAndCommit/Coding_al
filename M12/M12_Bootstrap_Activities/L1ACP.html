<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unequal Grids</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Unequal Grids</h1>
      <p class="lead mb-0">Create a colorful page using unequal Bootstrap grid columns.</p>
    </header>
    
<section class="bg-white p-4 rounded-4 shadow-sm">
  <h2 class="h4 mb-3">My grid dashboard</h2>
  <div class="row g-3 text-center fw-semibold">
    <div class="col-md-8"><div class="demo-box bg-primary text-white">Featured section (8)</div></div>
    <div class="col-md-4"><div class="demo-box bg-warning text-dark">Quick links (4)</div></div>
    <div class="col-md-4"><div class="demo-box bg-success text-white">News (4)</div></div>
    <div class="col-md-4"><div class="demo-box bg-danger text-white">Gallery (4)</div></div>
    <div class="col-md-4"><div class="demo-box bg-info text-dark">Contact (4)</div></div>
    <div class="col-md-3"><div class="demo-box bg-secondary text-white">Card A (3)</div></div>
    <div class="col-md-6"><div class="demo-box bg-dark text-white">Wide card (6)</div></div>
    <div class="col-md-3"><div class="demo-box bg-success text-white">Card B (3)</div></div>
  </div>
</section>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">My First Grid</h1>
      <p class="lead mb-0">Build a simple responsive grid with Bootstrap rows and columns.</p>
    </header>
    
<section class="bg-white rounded-4 shadow-sm p-4">
  <h2 class="h4">Three equal columns</h2>
  <p class="text-secondary">Bootstrap's grid uses a 12-column layout. These three columns each use four columns.</p>
  <div class="row g-3 text-white text-center fw-bold">
    <div class="col-md-4"><div class="demo-box bg-primary">Column 1</div></div>
    <div class="col-md-4"><div class="demo-box bg-success">Column 2</div></div>
    <div class="col-md-4"><div class="demo-box bg-danger">Column 3</div></div>
  </div>
</section>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

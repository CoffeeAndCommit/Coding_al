<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Color and Border</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Add Color and Border</h1>
      <p class="lead mb-0">Combine Bootstrap background, text, border and spacing utilities.</p>
    </header>
    
<div class="row g-3">
  <div class="col-md-4"><div class="p-4 bg-primary text-white rounded">Primary background</div></div>
  <div class="col-md-4"><div class="p-4 bg-warning text-dark border border-3 border-danger rounded">Warning with border</div></div>
  <div class="col-md-4"><div class="p-4 bg-light text-dark border border-success border-3 rounded">Light with green border</div></div>
</div>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

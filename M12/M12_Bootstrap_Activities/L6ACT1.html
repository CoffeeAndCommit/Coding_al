<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Bootstrap Carousel</h1>
      <p class="lead mb-0">Create a slideshow with previous and next controls.</p>
    </header>
    
<div id="myCarousel" class="carousel slide rounded-4 overflow-hidden shadow" data-bs-ride="carousel">
  <div class="carousel-indicators"><button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button><button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button><button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button></div>
  <div class="carousel-inner">
    <div class="carousel-item active"><div class="d-flex align-items-center justify-content-center flex-column text-center bg-primary text-white p-5" style="height:330px"><div class="display-1">🌄</div><h2>Explore Nature</h2><p>Enjoy the beauty of the outdoors.</p></div></div>
    <div class="carousel-item"><div class="d-flex align-items-center justify-content-center flex-column text-center bg-success text-white p-5" style="height:330px"><div class="display-1">🌱</div><h2>Grow Something</h2><p>Small actions can make a big difference.</p></div></div>
    <div class="carousel-item"><div class="d-flex align-items-center justify-content-center flex-column text-center bg-dark text-white p-5" style="height:330px"><div class="display-1">🚀</div><h2>Dream Big</h2><p>Keep learning and trying new things.</p></div></div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Previous</span></button>
  <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Next</span></button>
</div>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

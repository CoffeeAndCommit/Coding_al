<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Bar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Progress Bar</h1>
      <p class="lead mb-0">Display progress using Bootstrap progress components.</p>
    </header>
    
<section class="bg-white rounded-4 shadow-sm p-4">
  <h2 class="h4">My learning progress</h2>
  <label class="form-label mt-3">HTML — 90%</label><div class="progress mb-3" role="progressbar" aria-label="HTML progress" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:90%">90%</div></div>
  <label class="form-label">CSS — 65%</label><div class="progress mb-3" role="progressbar" aria-label="CSS progress" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar bg-success" style="width:65%">65%</div></div>
  <label class="form-label">Bootstrap — 40%</label><div class="progress" role="progressbar" aria-label="Bootstrap progress" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar bg-warning text-dark" style="width:40%">40%</div></div>
</section>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

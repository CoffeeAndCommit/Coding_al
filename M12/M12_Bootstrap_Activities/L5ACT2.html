<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .hero { background:linear-gradient(135deg,#153e75,#6c63ff); color:white; border-radius:1rem; }
    .demo-box { min-height:100px; display:flex; align-items:center; justify-content:center; border-radius:.5rem; }
    
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="hero p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold mb-2">M12 · Bootstrap Practice</p>
      <h1 class="display-5 fw-bold">Spinner</h1>
      <p class="lead mb-0">Show a loading indicator with Bootstrap spinners.</p>
    </header>
    
<section class="bg-white rounded-4 shadow-sm p-4 text-center">
  <h2 class="h4">Loading examples</h2>
  <div class="d-flex justify-content-around flex-wrap gap-4 py-4">
    <div><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div><p class="mt-2">Border spinner</p></div>
    <div><div class="spinner-grow text-success" role="status"><span class="visually-hidden">Loading...</span></div><p class="mt-2">Growing spinner</p></div>
    <div><button class="btn btn-primary" type="button" disabled><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading...</button><p class="mt-2">Button spinner</p></div>
  </div>
  <button class="btn btn-outline-secondary" onclick="document.getElementById('loadMessage').textContent='Done! Your sample content is ready.'">Simulate loading complete</button>
  <p id="loadMessage" class="mt-3" aria-live="polite">Please wait...</p>
</section>

    <footer class="text-center text-secondary small mt-5">Made for practice · Bootstrap 5</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

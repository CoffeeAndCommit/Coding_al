```html
<!DOCTYPE html>
<html>

<head>
    <title>CSS Hover</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        /* Button normal style */
        button {
            background-color: blue;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
        }

        /* Button when mouse is placed on it */
        button:hover {
            background-color: green;
            color: yellow;
            transform: scale(1.1);
        }

        /* Box normal style */
        .box {
            width: 200px;
            height: 100px;
            background-color: orange;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
        }

        /* Box when mouse is placed on it */
        .box:hover {
            background-color: purple;
            transform: rotate(5deg);
        }
    </style>
</head>

<body>

    <h1>CSS Hover</h1>

    <p>Move your mouse over the button and box!</p>

    <button>Hover Over Me</button>

    <div class="box">
        Hover Over This Box
    </div>

</body>

</html>
```

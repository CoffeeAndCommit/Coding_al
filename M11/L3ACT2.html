<!DOCTYPE html>
<html>

<head>
    <title>Typography</title>

    <style>
        body {
            background-color: lightyellow;
        }

        h1 {
            color: darkblue;
            font-family: Arial, sans-serif;
            font-size: 40px;
            text-align: center;
        }

        h2 {
            color: purple;
            font-family: Georgia, serif;
            font-size: 30px;
        }

        p {
            color: darkgreen;
            font-family: Verdana, sans-serif;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
        }

        .special {
            font-style: italic;
            text-decoration: underline;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <h1>Typography in CSS</h1>

    <h2>What is Typography?</h2>

    <p>
        Typography is the way we arrange and style text
        on a webpage. CSS helps us make text beautiful
        and easy to read.
    </p>

    <p class="special">
        This is a special paragraph with different
        typography styles.
    </p>

<!DOCTYPE html>
<html>

<head>
    <title>Text Styling Properties</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
            text-decoration: underline;
        }

        .text1 {
            font-size: 25px;
            font-family: Arial;
            font-weight: bold;
            font-style: italic;
        }

        .text2 {
            color: green;
            text-align: justify;
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 2;
        }

        .text3 {
            text-decoration: line-through;
            text-shadow: 2px 2px 3px gray;
        }
    </style>
</head>

<body>

    <h1>Text Styling Properties</h1>

    <p class="text1">
        This text is big, bold and italic.
    </p>

    <p class="text2">
        this is an example of text styling using different
        css properties. css makes our webpage beautiful.
    </p>

    <p class="text3">
        This text has a line through it and a shadow.
    </p>

</body>

</html>

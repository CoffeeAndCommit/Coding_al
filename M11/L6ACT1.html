<!DOCTYPE html>
<html>

<head>
    <title>Precise Positioning</title>

    <style>
        .container {
            width: 500px;
            height: 300px;
            background-color: lightblue;
            position: relative;
            margin: 50px auto;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: orange;
            position: absolute;
            top: 50px;
            left: 100px;
        }

        .top-right {
            width: 100px;
            height: 100px;
            background-color: green;
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>

<body>

    <h1>Precise Positioning</h1>

    <div class="container">

        <div class="box">
            Box 1
        </div>

        <div class="top-right">
            Box 2
        </div>

    </div>

</body>

</html>

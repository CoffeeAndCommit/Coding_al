<!DOCTYPE html>
<html>

<head>
    <title>CSS Focus</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        input {
            width: 250px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid gray;
            border-radius: 5px;
            margin: 10px;
        }

        /* Style when the input is selected */
        input:focus {
            border: 3px solid blue;
            background-color: lightyellow;
            outline: none;
        }

        textarea {
            width: 250px;
            height: 100px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid gray;
        }

        textarea:focus {
            border: 3px solid green;
            background-color: lightgreen;
            outline: none;
        }
    </style>
</head>

<body>

    <h1>CSS Focus</h1>

    <p>Click inside an input box and start typing.</p>

    <input type="text" placeholder="Enter your name">

    <br>

    <input type="email" placeholder="Enter your email">

    <br>

    <textarea placeholder="Write a message"></textarea>

</body>

</html>

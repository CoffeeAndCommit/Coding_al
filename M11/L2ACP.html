<!-- Cascading Effect -->

```html id="b8j2v4"
<!DOCTYPE html>
<html>

<head>
    <title>Cascading Effect</title>

    <style>
        /* Element selector */
        p {
            color: blue;
            font-size: 20px;
        }

        /* Class selector */
        .special {
            color: green;
        }

        /* ID selector */
        #important {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Cascading Effect in CSS</h1>

    <p>This paragraph is blue.</p>

    <p class="special">
        This paragraph is green.
    </p>

    <p id="important">
        This paragraph is red.
    </p>

</body>

</html>
```

<!DOCTYPE html>
<html>

<head>
    <title>CSS Box Model Properties</title>

    <style>
        .box {
            width: 200px;
            height: 100px;

            /* Content */
            background-color: lightblue;

            /* Padding */
            padding: 20px;

            /* Border */
            border: 5px solid blue;

            /* Margin */
            margin: 30px;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model Properties</h1>

    <div class="box">
        This is the content.
    </div>

</body>

</html>

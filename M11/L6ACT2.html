<!DOCTYPE html>
<html>

<head>
    <title>Opacity Property</title>

    <style>
        .box1 {
            width: 200px;
            height: 100px;
            background-color: blue;
            opacity: 1;
            padding: 20px;
            margin: 20px;
        }

        .box2 {
            width: 200px;
            height: 100px;
            background-color: blue;
            opacity: 0.5;
            padding: 20px;
            margin: 20px;
        }

        .box3 {
            width: 200px;
            height: 100px;
            background-color: blue;
            opacity: 0.2;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Opacity Property</h1>

    <div class="box1">
        Opacity: 1
    </div>

    <div class="box2">
        Opacity: 0.5
    </div>

    <div class="box3">
        Opacity: 0.2
    </div>

</body>

</html>

```html
<!DOCTYPE html>
<html>

<head>
    <title>CSS Background</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
            text-align: center;
            background-color: white;
            padding: 20px;
        }

        p {
            color: black;
            font-size: 20px;
            background-color: lightyellow;
            padding: 15px;
        }

        .box {
            width: 400px;
            height: 200px;

            background-color: lightgreen;

            /* Background image */
            background-image: url("https://www.w3schools.com/css/img_tree.png");

            /* Do not repeat the image */
            background-repeat: no-repeat;

            /* Position the image */
            background-position: center;

            /* Cover the complete box */
            background-size: cover;

            padding: 20px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <h1>CSS Background</h1>

    <p>
        We can use CSS to change the background color
        and background image of an HTML element.
    </p>

    <div class="box">
        <h2>Background Image</h2>
        <p>This box has a background image.</p>
    </div>

</body>

</html>
```

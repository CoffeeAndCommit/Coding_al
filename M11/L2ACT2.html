```html
<!DOCTYPE html>
<html>

<head>
    <title>CSS Gradients</title>

    <style>
        /* Linear Gradient */
        .linear {
            height: 200px;
            background: linear-gradient(red, yellow);
            padding: 20px;
            margin: 20px;
        }

        /* Linear Gradient with Direction */
        .direction {
            height: 200px;
            background: linear-gradient(to right, blue, green);
            padding: 20px;
            margin: 20px;
        }

        /* Radial Gradient */
        .radial {
            height: 200px;
            background: radial-gradient(circle, orange, purple);
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <h2>1. Linear Gradient</h2>

    <div class="linear">
        <h3>Red to Yellow</h3>
    </div>

    <h2>2. Linear Gradient with Direction</h2>

    <div class="direction">
        <h3>Blue to Green</h3>
    </div>

    <h2>3. Radial Gradient</h2>

    <div class="radial">
        <h3>Orange to Purple</h3>
    </div>

</body>

</html>
```

```html
<!DOCTYPE html>
<html>

<head>
    <title>Active and Disabled</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        button {
            background-color: green;
            color: white;
            padding: 12px 25px;
            border: none;
            font-size: 18px;
            margin: 10px;
        }

        /* Active state */
        button:active {
            background-color: red;
            transform: scale(0.9);
        }

        /* Disabled button */
        button:disabled {
            background-color: gray;
            color: black;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <h1>CSS Active and Disabled</h1>

    <h2>Active Button</h2>

    <button>Click Me</button>

    <h2>Disabled Button</h2>

    <button disabled>Disabled</button>

</body>

</html>
```
